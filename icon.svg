<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="combGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2a2a" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#fef08a" />
      <stop offset="88%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
  </defs>

  <!-- App Background & Weather Radar Ring -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <circle cx="256" cy="280" r="195" fill="none" stroke="#1e293b" stroke-width="10" stroke-dasharray="22 14" />
  <circle cx="256" cy="280" r="160" fill="#1e293b" opacity="0.4" />

  <!-- Angry Spiky Comb (Crown) -->
  <path d="M 165 180
           C 120 120, 145 55, 195 100
           C 205 30, 245 15, 256 85
           C 267 15, 307 30, 317 100
           C 367 55, 392 120, 347 180 Z" fill="url(#combGrad)" stroke="#450a0a" stroke-width="8" stroke-linejoin="round" />

  <!-- Red Wattles (Hanging Under Chin) -->
  <path d="M 185 355
           C 145 430, 195 495, 244 435
           L 256 385
           L 268 435
           C 317 495, 367 430, 327 355 Z" fill="url(#combGrad)" stroke="#450a0a" stroke-width="8" stroke-linejoin="round" />

  <!-- Ruffled Head & Neck Feathers -->
  <path d="M 160 155
           C 110 190, 95 250, 75 290
           L 118 295
           L 85 360
           L 138 355
           L 115 435
           Q 256 465 397 435
           L 374 355
           L 427 360
           L 394 295
           L 437 290
           C 417 250, 402 190, 352 155
           Q 256 125 160 155 Z" fill="url(#bodyGrad)" stroke="#0f172a" stroke-width="10" stroke-linejoin="round" />

  <!-- Red Face Mask Around Eyes -->
  <path d="M 125 245
           Q 256 190 387 245
           Q 405 320 355 350
           Q 256 375 157 350
           Q 107 320 125 245 Z" fill="#dc2626" stroke="#450a0a" stroke-width="6" />

  <!-- GIANT STARE EYES (Left & Right) -->
  <g>
    <!-- Left Eye -->
    <circle cx="182" cy="272" r="58" fill="url(#eyeGlow)" stroke="#090d16" stroke-width="10" />
    <!-- Left Bloodshot Veins -->
    <path d="M 132 265 L 146 270 M 136 288 L 150 282" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <!-- Left Intense Pinpoint Pupil -->
    <circle cx="192" cy="274" r="22" fill="#090d16" />
    <circle cx="182" cy="262" r="8" fill="#ffffff" />
    <circle cx="202" cy="284" r="4" fill="#ffffff" />

    <!-- Right Eye -->
    <circle cx="330" cy="272" r="58" fill="url(#eyeGlow)" stroke="#090d16" stroke-width="10" />
    <!-- Right Bloodshot Veins -->
    <path d="M 380 265 L 366 270 M 376 288 L 362 282" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <!-- Right Intense Pinpoint Pupil -->
    <circle cx="320" cy="274" r="22" fill="#090d16" />
    <circle cx="310" cy="262" r="8" fill="#ffffff" />
    <circle cx="330" cy="284" r="4" fill="#ffffff" />
  </g>

  <!-- Heavy Angry V-Shaped Brow Ridge (Cutting Over Top of Eyes) -->
  <path d="M 105 215
           L 256 282
           L 407 215
           L 392 178
           L 256 242
           L 120 178 Z" fill="#0f172a" />
  <path d="M 112 212 L 256 278 L 400 212" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Forehead Scowl Wrinkles -->
  <path d="M 238 195 L 256 222 L 274 195" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sharp Front-Facing Hooked Beak -->
  <!-- Lower Open Scowling Beak -->
  <path d="M 218 352 L 256 418 L 294 352 Z" fill="#92400e" stroke="#090d16" stroke-width="8" stroke-linejoin="round" />
  <!-- Upper Hooked Beak -->
  <path d="M 200 340
           Q 256 290 312 340
           L 256 402 Z" fill="url(#beakGrad)" stroke="#090d16" stroke-width="9" stroke-linejoin="round" />
  <!-- Beak Center Ridge & Nostrils -->
  <line x1="256" y1="315" x2="256" y2="395" stroke="#b45309" stroke-width="4" stroke-linecap="round" />
  <path d="M 232 338 L 242 345 M 280 338 L 270 345" stroke="#090d16" stroke-width="5" stroke-linecap="round" />
</svg>
